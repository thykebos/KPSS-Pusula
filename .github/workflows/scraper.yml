name: İlan Botu

on:
  # Her saat başı otomatik çalış
  schedule:
    - cron: "0 * * * *"

  # GitHub arayüzünden elle de başlatılabilsin (Actions sekmesi > İlan Botu > Run workflow)
  workflow_dispatch:
    inputs:
      source:
        description: "Kaynak: all, kariyerkapisi, yerelyonetimler, pgm_adalet, kamuilan, iskur"
        required: false
        default: "all"
      mode:
        description: "run = ilanları tara ve Supabase'e yaz | discover = YAZMADAN site yapısını incele (debug çıktısı indirilebilir)"
        required: false
        default: "run"
        type: choice
        options:
          - run
          - discover

jobs:
  scrape:
    name: İlanları Tara
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Bağımlılıkları kur
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Playwright kur (JavaScript'li siteler için)
        working-directory: scraper
        run: |
          pip install -r requirements-js.txt
          playwright install chromium --with-deps

      - name: İlanları tara ve Supabase'e yaz
        if: ${{ github.event.inputs.mode != 'discover' }}
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          SOURCE="${{ github.event.inputs.source }}"
          SOURCE="${SOURCE:-all}"
          python3 run.py --source "$SOURCE"

      # Keşif modu: veritabanına yazmaz, anahtar gerektirmez. Ham sayfalar ve ağ istekleri
      # "debug" adlı dosya olarak çalıştırma sayfasının altından indirilir.
      - name: Site yapısını incele (discover)
        if: ${{ github.event.inputs.mode == 'discover' }}
        working-directory: scraper
        run: |
          SOURCE="${{ github.event.inputs.source }}"
          SOURCE="${SOURCE:-all}"
          python3 run.py --source "$SOURCE" --discover --debug-dir debug

      - name: Debug çıktısını yükle
        if: ${{ github.event.inputs.mode == 'discover' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: scraper/debug/
          if-no-files-found: warn
          retention-days: 7
